services:
  backend:
    build: ./backend
    container_name: deli_bag_backend
    restart: always
    env_file:
      - .env
    expose:
      - "8000"

  frontend:
    image: nginx:alpine
    container_name: deli_bag_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
