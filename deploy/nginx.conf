events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    gzip on;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;
    gzip_min_length 1024;

    # HTTP -> HTTPS
    server {
        listen 80;
        server_name deli-bag.ru www.deli-bag.ru;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name deli-bag.ru www.deli-bag.ru;

        ssl_certificate /etc/letsencrypt/live/deli-bag.ru/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/deli-bag.ru/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        # Static root mounted from ./frontend
        root /usr/share/nginx/html;
        index index.html;

        # Security & content headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Long-term cache for static assets
        location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|webp|woff2?|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
            try_files $uri =404;
        }

        # Backwards-compatible legal URLs (old /privacy.html links keep working)
        location = /privacy.html  { return 301 /legal/privacy.html;  }
        location = /offer.html    { return 301 /legal/offer.html;    }
        location = /contacts.html { return 301 /legal/contacts.html; }

        # Clean URLs for legal pages
        location = /privacy  { try_files /legal/privacy.html  =404; }
        location = /offer    { try_files /legal/offer.html    =404; }
        location = /contacts { try_files /legal/contacts.html =404; }

        # API proxy to FastAPI backend
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Default routing — static files, then SPA-style fallback to index
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
